# Backup of previous .chgsmart.yml
# This file is now archived. The merged config is in project root.
group_by: type
ignore:
  - "^Merge "
  - "^WIP"
  - "^chore: bump"
areas:
  auth:
    - "(?i)auth"
    - "(?i)oauth"
    - "(?i)token"
  logging:
    - "(?i)log"
    - "(?i)telemetry"
    - "(?i)trace"
  data:
    - "(?i)db"
    - "(?i)sql"
    - "(?i)migration"
